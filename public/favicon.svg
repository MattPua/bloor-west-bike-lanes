<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bloor West bike lanes">
  <rect width="32" height="32" fill="#f2f4f3"/>
  <!-- sidewalks -->
  <rect x="0" y="0" width="32" height="5" fill="#d8dcd9"/>
  <rect x="0" y="27" width="32" height="5" fill="#d8dcd9"/>
  <!-- bike lanes -->
  <rect x="0" y="5" width="32" height="5" fill="#5a7c12"/>
  <rect x="0" y="22" width="32" height="5" fill="#5a7c12"/>
  <!-- barriers -->
  <rect x="0" y="10" width="32" height="1.5" fill="#9a6b12"/>
  <rect x="0" y="20.5" width="32" height="1.5" fill="#9a6b12"/>
  <!-- car bed -->
  <rect x="0" y="11.5" width="32" height="9" fill="#3a3c38"/>
  <rect x="14" y="12.5" width="1.5" height="7" fill="#d4a84b"/>
  <!-- crash marker -->
  <circle cx="24" cy="8" r="2.4" fill="#c4102e"/>
</svg>
